<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplicación Gestor</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <h1>APLICACIÓN GESTOR</h1>

    <!-- LOGIN -->
    <div id="login" class="seccion activa">
        <h2>LOGIN</h2>
        <div>
            <label for="user">Usuario</label>
            <input type="text" id="user">
        </div>
        <div>
            <label for="password">Contraseña</label>
            <input type="password" id="password">
        </div>
        <div>
            <button onclick="enviarLogin()">Entrar</button>
            <button onclick="cambiarEscena('register')">Registrarse</button>
        </div>
    </div>

    <!-- REGISTRO / EDITAR GESTOR -->
    <div id="register" class="seccion">
        <h2>DATOS GESTOR</h2>
        <div>
            <label for="reg_nombre">Nombre</label>
            <input type="text" id="reg_nombre">
        </div>
        <div>
            <label for="reg_apellidos">Apellidos</label>
            <input type="text" id="reg_apellidos">
        </div>
        <div>
            <label for="reg_usuario">Usuario</label>
            <input type="text" id="reg_usuario">
        </div>
        <div>
            <label for="reg_password">Contraseña</label>
            <input type="password" id="reg_password">
        </div>
        <div>
            <button onclick="guardarGestor()">Guardar</button>
            <button onclick="cancelarRegistro()">Cancelar</button>
        </div>
    </div>

    <!-- HOME -->
    <div id="start" class="seccion">
        <h2>INICIO</h2>
        <div>
            <p id="texto-bienvenida"></p>
            <button onclick="abrirEditarGestor()">Editar datos</button>
        </div>

        <div>
            <h3>Búsqueda de recursos</h3>
            <div>
                <div>
                    <label for="cat">Categoría</label>
                    <select id="cat">
                        <option value="">Todos</option>
                    </select>
                </div>
                    
                <div>
                    <label for="model">Modelo</label>
                    <select id="model">
                        <option value="">Todos</option>
                    </select>
                </div>
                <div>
                    <label for="ubication">Ubicación</label>
                    <select id="ubication">
                        <option value="">Todos</option>
                    </select>
                </div>
                <div>
                    <label for="status">Estado</label>
                    <select id="status">
                        <option value="">Todos</option>
                        <option value="0">Operativo</option>
                        <option value="1">De baja o defectuoso</option>
                        <option value="2">En mantenimiento</option>
                    </select>
                </div>
                <div>
                    <button onclick="buscarFiltro()">Buscar</button>
                </div>
            </div>
        </div>

        <div>
            <h3>Recursos</h3>
            <table id="tablaHome">
                <thead>
                    <tr>
                        <th>N. Serie</th>
                        <th>Categoría</th>
                        <th>Modelo</th>
                        <th>Ubicación</th>
                        <th>Estado</th>
                        <th>Opciones</th>
                    </tr>
                </thead>
                <tbody id="bodyTablaHome"></tbody>
            </table>
            <button onclick="nuevoRecurso()">Añadir Recurso</button>
        </div>

        <div>
            <button onclick="salir()">Salir</button>
        </div>
    </div>

    <!-- RECURSO DATOS -->
    <div id="ressource" class="seccion">
        <h2>RECURSO</h2>
        <h3>Datos recurso</h3>
        <div>
            <label for="categoryEditor">Categoría</label>
            <select id="categoryEditor">
                <option value="">-- Selecciona --</option>
            </select>
        </div>
        <div>
            <label for="modelEditor">Modelo</label>
            <select id="modelEditor">
                <option value="">-- Selecciona --</option>
            </select>
        </div>
        <div>
            <label for="serieEditor">Núm. Serie</label>
            <input type="text" id="serieEditor">
        </div>
        <div>
            <label for="ubicationEditor">Ubicación</label>
            <select id="ubicationEditor">
                <option value="">-- Selecciona --</option>
            </select>
        </div>
        <div>
            <label for="statusEditor">Estado</label>
            <select id="statusEditor">
                <option value="0">Operativo</option>
                <option value="1">De baja o defectuoso</option>
                <option value="2">En mantenimiento</option>
            </select>
        </div>
        <button onclick="guardarRecurso()">Guardar</button>

        <div>
            <h3>Reservas</h3>
            <table id="tablaReservas">
                <thead>
                    <tr>
                        <th>Sanitario</th>
                        <th>H. Estimadas</th>
                        <th>F. Petición</th>
                        <th>F. Inicio</th>
                        <th>F. Fin</th>
                    </tr>
                </thead>
                <tbody id="bodyTablaReservas"></tbody>
            </table>
        </div>

        <div>
            <h3>Reseñas</h3>
            <table id="tablaResenyas">
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Sanitario</th>
                        <th>Valoración</th>
                        <th>Comentario</th>
                    </tr>
                </thead>
                <tbody id="bodyTablaResenyas"></tbody>
            </table>
        </div>

        <button onclick="cambiarEscena('start')">Volver al listado</button>
    </div>

    <script src="rest.js"></script>
    <script src="main.js"></script>
</body>
</html>
